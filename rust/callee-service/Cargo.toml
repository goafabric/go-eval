[package]
name = "callee-service"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
opentelemetry = "0.33.1"
opentelemetry-http = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
